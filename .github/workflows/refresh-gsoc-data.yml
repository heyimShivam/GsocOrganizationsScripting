name: Refresh GSoC Data

on:
  push:
    branches:
      - develop

  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run GSoC compiler
        env:
          ITHUB_TOKEN: ${{ secrets.ITHUB_TOKEN }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          MIN_TIME_MS: ${{secrets.MIN_TIME_MS}}
          USE_OLD_RECORDS: ${{secrets.USE_OLD_RECORDS}}
          WRITE_LEGACY_JSON: ${{secrets.WRITE_LEGACY_JSON}}

          USE_OLD_RECORDS: false
          WRITE_LEGACY_JSON: true
          ACTIVITY_REPO_LIMIT: 3
          ITHUBMIN_TIME_MS: 2000
          ITHUB_MAX_CONCURRENT: 1
          MAX_GITHUB_RETRIES: 2

        run: node index.js