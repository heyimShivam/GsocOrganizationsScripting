name: Refresh GSoC Data

on:
  push:
    branches:
      - prod

  workflow_dispatch:

jobs:

  # =========================================================
  # JOB 1
  # Fetch all GSoC data + GitHub enrichment
  # =========================================================
  fetch:
    name: Fetch + compile all GitHub data

    runs-on: ubuntu-latest

    timeout-minutes: 360

    outputs:
      batches: ${{ steps.batches.outputs.batches }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch and compile
        env:
          ITHUB_TOKEN: ${{ secrets.ITHUB_TOKEN }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}

          USE_OLD_RECORDS: ${{ secrets.USE_OLD_RECORDS }}
          WRITE_LEGACY_JSON: ${{ secrets.WRITE_LEGACY_JSON }}

          ACTIVITY_REPO_LIMIT: 3

          ITHUBMIN_TIME_MS: 400
          ITHUB_MAX_CONCURRENT: 1
          MAX_GITHUB_RETRIES: 2

          DB_BATCH_SIZE: 100

        run: node index.js fetch

      # IMPORTANT:
      # metadata.batches contains objects:
      #
      # [
      #   { "file": "batch-000.json", "count": 100 },
      #   { "file": "batch-001.json", "count": 100 }
      # ]
      #
      # We extract ONLY the file names for the matrix.
      - name: Read batch manifest
        id: batches
        shell: bash
        run: |
          batches="$(node -e '
            const fs = require("fs");

            const metadata = JSON.parse(
              fs.readFileSync("output/metadata.json", "utf8")
            );

            const files = metadata.batches.map(batch => batch.file);

            process.stdout.write(JSON.stringify(files));
          ')"

          echo "Batches: $batches"

          echo "batches=$batches" >> "$GITHUB_OUTPUT"

      - name: Upload complete enriched dataset
        uses: actions/upload-artifact@v4
        with:
          name: enriched-organization-data
          path: output/
          retention-days: 3


  # =========================================================
  # JOB 2
  # Persist database batches
  # =========================================================
  persist:
    name: Persist database batch

    needs: fetch

    if: ${{ needs.fetch.result == 'success' }}

    runs-on: ubuntu-latest

    timeout-minutes: 360

    strategy:
      fail-fast: false

      # VERY IMPORTANT:
      # Only one database batch runs at a time.
      max-parallel: 1

      matrix:
        batch: ${{ fromJSON(needs.fetch.outputs.batches) }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download prepared data
        uses: actions/download-artifact@v4
        with:
          name: enriched-organization-data
          path: output/

      - name: Show batch being processed
        run: |
          echo "Processing batch:"
          echo "${{ matrix.batch }}"

      - name: Persist batch to Neon
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}

        run: |
          node index.js persist "output/batches/${{ matrix.batch }}"

      - name: Upload batch result
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: batch-result-${{ matrix.batch }}
          path: output/batches/*-result.json
          if-no-files-found: ignore
          retention-days: 3


  # =========================================================
  # JOB 3
  # Verify everything + final cleanup
  # =========================================================
  finalize:
    name: Finalize sync + cleanup

    needs:
      - fetch
      - persist

    # Run even when persist has failures.
    #
    # finalize itself checks whether ALL batches succeeded.
    # Cleanup is only performed when everything succeeded.
    if: ${{ always() && needs.fetch.result == 'success' }}

    runs-on: ubuntu-latest

    timeout-minutes: 60

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download prepared data
        uses: actions/download-artifact@v4
        with:
          name: enriched-organization-data
          path: output/

      - name: Download batch results
        uses: actions/download-artifact@v4
        with:
          pattern: batch-result-*
          path: output/batch-results/
          merge-multiple: true

      - name: Show downloaded batch results
        run: |
          echo "Batch results:"
          find output/batch-results -type f -maxdepth 1 -print || true

      - name: Finalize database sync
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}

          PIPELINE_METADATA: output/metadata.json
          BATCH_RESULT_DIR: output/batch-results/

        run: node index.js finalize